services:
  - type: web
    name: discord-panel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: DISPLAY_PREFIX
        sync: false
      - key: NODE_VERSION
        value: 22
